# =====================================================
# HYPRLOCK - TOKYO NIGHT 
# =====================================================
#
# Paleta:
#   bg        #1a1b26    fg        #c0caf5
#   fg_dark   #a9b1d6    comment   #565f89
#   blue      #7aa2f7    cyan      #7dcfff
#   purple    #bb9af7    red       #f7768e
#   green     #9ece6a    yellow    #e0af68

$font = JetBrainsMono Nerd Font

$fg      = rgba(c0caf5ff)
$fg_dark = rgba(a9b1d6ff)
$comment = rgba(565f89ff)
$blue    = rgba(7aa2f7ff)
$purple  = rgba(bb9af7ff)
$red     = rgba(f7768eff)
$green   = rgba(9ece6aff)


general {
    hide_cursor = true
    grace = 2
}


animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 7, smooth
    animation = fadeOut, 1, 7, smooth
    animation = inputFieldDots, 1, 3, smooth
}


# -----------------------------------------------------
# BACKGROUND
# -----------------------------------------------------

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.1
    vibrancy_darkness = 0.2
    color = rgba(1a1b26ff)
}


# -----------------------------------------------------
# RELÓGIO  
# -----------------------------------------------------

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 140, 60
    halign = left
    valign = center
}


# -----------------------------------------------------
# DATA  
# -----------------------------------------------------

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $comment
    font_size = 18
    font_family = $font
    position = 146, -20
    halign = left
    valign = center
}


# -----------------------------------------------------
# USUÁRIO  
# -----------------------------------------------------

label {
    monitor =
    text = $USER
    color = $comment
    font_size = 13
    font_family = $font
    position = 0, 48
    halign = center
    valign = center
}


# -----------------------------------------------------
# CAMPO DE SENHA  
# -----------------------------------------------------

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    rounding = 12

    inner_color = rgba(1a1b2666)
    outer_color = rgba(565f89ff) rgba(7aa2f7ff) 45deg
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
    font_color = $fg

    placeholder_text = <span foreground="##565f89">senha</span>
    fail_text = <span foreground="##f7768e">errada</span>

    fade_on_empty = true
    fade_timeout = 1500
    hide_input = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    position = 0, 0
    halign = center
    valign = center
    font_family = $font
}


# -----------------------------------------------------
# LAYOUT DO TECLADO  (canto inferior direito, discreto)
# -----------------------------------------------------

label {
    monitor =
    text = $LAYOUT
    color = $comment
    font_size = 13
    font_family = $font
    position = -100, 100
    halign = right
    valign = bottom
}